<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiamiMuscle Imports — Case Study · Glory Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Monoton&family=Bebas+Neue&family=Audiowide&family=Inter:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F48A56; --red:#E9382A; --lpink:#F671A6; --hpink:#E71875;
    --night:#0a0418; --dpurple:#1a0838; --purple:#2d0a5e; --bpurple:#4a0e7a;
    --carbody:#CC1055; --gold:#C9A227; --navy:#1a2744;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#ffffff;}
  body{font-family:'Inter',sans-serif;color:#0a0418;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;}
  .slide{position:relative;width:1440px;overflow:hidden;flex:none;}
  .label{font-family:'Audiowide',sans-serif;letter-spacing:.18em;text-transform:uppercase;}
  .bebas{font-family:'Bebas Neue',sans-serif;}
  .caveat{font-family:'Caveat',cursive;}
  .mono{font-family:'Monoton',cursive;}
  .audio{font-family:'Audiowide',sans-serif;}

  /* ---------- COVER ---------- */
  #cover{height:900px;background:radial-gradient(ellipse at 50% 38%, #4a0e7a 0%, #2d0a5e 45%, #0a0418 100%);color:#fff;}
  #cover .topbar{position:absolute;top:48px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;}
  #cover .cs-tag{font-size:16px;color:var(--gold);text-align:right;line-height:1.6;}
  #cover .center{position:absolute;top:170px;left:0;right:0;text-align:center;z-index:4;}
  #cover .miami{font-family:'Bebas Neue',sans-serif;font-size:180px;line-height:.82;letter-spacing:-2px;color:#fff;text-shadow:0 0 40px rgba(246,113,166,.35);}
  #cover .muscle{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:6px;color:var(--lpink);margin-top:6px;text-shadow:0 0 26px rgba(231,24,117,.5);}
  #cover .sub{font-family:'Caveat',cursive;font-style:italic;font-size:48px;color:#fff;margin-top:18px;opacity:.95;}
  #cover .chips{margin-top:30px;display:flex;gap:16px;justify-content:center;}
  #cover .chip{border:1.5px solid var(--lpink);color:var(--lpink);padding:10px 24px;border-radius:30px;font-size:13px;letter-spacing:.22em;font-weight:600;text-transform:uppercase;box-shadow:0 0 18px rgba(246,113,166,.25);}
  /* neon grid floor */
  #cover .floor{position:absolute;left:0;right:0;bottom:0;height:360px;overflow:hidden;z-index:1;perspective:340px;}
  #cover .grid{position:absolute;left:-30%;right:-30%;bottom:0;height:520px;background-image:
      linear-gradient(to right, rgba(246,113,166,.55) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(231,24,117,.55) 1px, transparent 1px);
    background-size:70px 60px;transform:rotateX(74deg);transform-origin:bottom center;
    -webkit-mask-image:linear-gradient(to top, #000 30%, transparent 100%);mask-image:linear-gradient(to top, #000 30%, transparent 100%);}
  #cover .floorglow{position:absolute;left:0;right:0;bottom:0;height:260px;background:radial-gradient(ellipse at 50% 100%, rgba(231,24,117,.5), transparent 65%);z-index:2;}
  #cover .carwrap{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;z-index:3;}

  /* ---------- SLIDE 2: BRIEF ---------- */
  #brief{min-height:720px;background:#fff;padding:90px 70px;display:grid;grid-template-columns:600px 1fr;gap:70px;}
  #brief .leftcol{position:relative;}
  #brief .bignum{position:absolute;top:-50px;left:-10px;font-family:'Bebas Neue',sans-serif;font-size:300px;line-height:.8;color:var(--hpink);opacity:.08;z-index:0;pointer-events:none;}
  #brief .briefinner{position:relative;z-index:1;}
  #brief .toplabel{font-family:'Audiowide',sans-serif;font-size:14px;letter-spacing:.2em;color:var(--hpink);margin-bottom:18px;}
  #brief h2{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:.95;color:#0a0418;letter-spacing:1px;margin-bottom:26px;}
  #brief p{font-size:16px;line-height:1.75;color:#3a3548;margin-bottom:18px;max-width:540px;}
  #brief .rightcol{display:flex;flex-direction:column;gap:18px;padding-top:30px;}
  .infobox{border:1.5px solid #ece9f2;border-left:4px solid var(--hpink);border-radius:12px;padding:20px 24px;background:#fcfbfe;}
  .infobox .k{font-family:'Audiowide',sans-serif;font-size:11px;letter-spacing:.18em;color:#9a93ab;text-transform:uppercase;margin-bottom:7px;}
  .infobox .v{font-size:17px;font-weight:600;color:#1a0838;line-height:1.5;}
  .infobox.alt{border-left-color:var(--bpurple);}
  .infobox.alt2{border-left-color:var(--orange);}

  /* ---------- SLIDE 3: DESIGN SYSTEM ---------- */
  #design{min-height:900px;background:#f8f8f8;padding:80px 70px;}
  #design .toplabel{font-family:'Audiowide',sans-serif;font-size:15px;letter-spacing:.2em;color:var(--hpink);margin-bottom:46px;}
  #design .cols{display:grid;grid-template-columns:1fr 1fr;gap:70px;}
  #design h3{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:1px;color:#0a0418;margin-bottom:34px;}
  .swatchrow{display:flex;gap:18px;flex-wrap:wrap;}
  .swatch{width:120px;}
  .swatch .chip{width:120px;height:120px;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.12);}
  .swatch .hex{font-family:'Inter',monospace;font-size:13px;font-weight:700;margin-top:12px;color:#1a0838;}
  .swatch .nm{font-size:12px;color:#8a8497;margin-top:3px;}
  .typorow{display:flex;align-items:center;gap:28px;padding:22px 0;border-bottom:1px solid #e7e4ee;}
  .typorow .glyph{width:120px;text-align:center;color:#0a0418;flex:none;}
  .typorow .desc .tname{font-size:18px;font-weight:700;color:#1a0838;}
  .typorow .desc .tmeta{font-size:13px;color:#8a8497;margin-top:4px;}

  /* ---------- BROWSER MOCKUP (slide 4) ---------- */
  #desktop{background:#eceaf1;padding:70px 30px 90px;display:flex;flex-direction:column;align-items:center;}
  #desktop .seclabel{font-family:'Audiowide',sans-serif;font-size:15px;letter-spacing:.2em;color:var(--hpink);margin-bottom:8px;align-self:center;}
  #desktop .sectitle{font-family:'Bebas Neue',sans-serif;font-size:48px;color:#0a0418;margin-bottom:40px;letter-spacing:1px;}
  .browser{width:1380px;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px rgba(26,8,56,.28);background:#fff;border:1px solid #d6d2df;}
  .chrome{background:#2b2b33;padding:12px 16px;display:flex;align-items:center;gap:14px;}
  .dots{display:flex;gap:8px;}
  .dots i{width:13px;height:13px;border-radius:50%;display:block;}
  .dots i:nth-child(1){background:#ff5f57;} .dots i:nth-child(2){background:#febc2e;} .dots i:nth-child(3){background:#28c840;}
  .tabs{display:flex;gap:6px;margin-left:8px;}
  .tab{background:#3a3a45;color:#cfcad9;font-size:12px;padding:7px 16px;border-radius:8px 8px 0 0;}
  .tab.active{background:#15121d;color:#fff;}
  .addr{flex:1;background:#15121d;border-radius:9px;padding:8px 16px;color:#b9b2c9;font-size:13px;display:flex;align-items:center;gap:10px;}
  .addr .lock{color:#28c840;font-size:11px;}
  .site{width:100%;}

  /* site internals (shared desktop+mobile via classes) */
  .nav{background:#120a22;display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid rgba(246,113,166,.18);}
  .nav .logo{font-family:'Caveat',cursive;font-weight:700;font-size:30px;color:var(--lpink);}
  .nav .links{display:flex;gap:30px;}
  .nav .links a{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:#fff;text-decoration:none;opacity:.88;}
  .nav .cta{background:linear-gradient(90deg,var(--hpink),var(--orange));color:#fff;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;padding:9px 26px;border-radius:30px;}

  .hero{position:relative;height:600px;overflow:hidden;background:radial-gradient(ellipse at 50% 110%, #4a0e7a 0%, #2d0a5e 40%, #0a0418 100%);color:#fff;}
  .hero .floor{position:absolute;left:-30%;right:-30%;bottom:0;height:300px;background-image:
      linear-gradient(to right, rgba(246,113,166,.5) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(231,24,117,.5) 1px, transparent 1px);
    background-size:60px 50px;transform:perspective(300px) rotateX(72deg);transform-origin:bottom center;
    -webkit-mask-image:linear-gradient(to top,#000 25%,transparent 100%);mask-image:linear-gradient(to top,#000 25%,transparent 100%);}
  .hero .glow{position:absolute;left:0;right:0;bottom:0;height:340px;background:radial-gradient(ellipse at 50% 100%, rgba(231,24,117,.45),transparent 60%);}
  .hero .eyebrow{position:absolute;top:46px;left:0;right:0;text-align:center;font-family:'Audiowide',sans-serif;font-size:13px;letter-spacing:.32em;color:var(--lpink);}
  .hero .htext{position:absolute;top:150px;left:0;right:0;text-align:center;z-index:3;}
  .hero .htext .l1{font-family:'Caveat',cursive;font-weight:700;font-size:96px;line-height:.9;text-shadow:0 0 30px rgba(246,113,166,.6);}
  .hero .htext .l2{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:5px;color:var(--lpink);text-shadow:0 0 24px rgba(231,24,117,.6);margin-top:6px;}
  .hero .flag{position:absolute;left:60px;top:160px;z-index:4;}
  .hero .carstage{position:absolute;left:0;right:0;bottom:90px;display:flex;justify-content:center;z-index:3;}
  .hero .scrolldots{position:absolute;bottom:26px;left:0;right:0;display:flex;gap:9px;justify-content:center;z-index:4;}
  .hero .scrolldots i{width:8px;height:8px;border-radius:50%;background:rgba(246,113,166,.4);display:block;}
  .hero .scrolldots i:first-child{background:var(--lpink);box-shadow:0 0 10px var(--lpink);}

  .ticker{background:#0a0418;border-top:1px solid rgba(246,113,166,.2);border-bottom:1px solid rgba(246,113,166,.2);overflow:hidden;padding:14px 0;white-space:nowrap;}
  .ticker span{font-family:'Monoton',cursive;font-size:20px;color:var(--lpink);letter-spacing:2px;opacity:.85;}

  .ablauf{background:#0d0620;padding:60px 50px;display:grid;grid-template-columns:1fr 1fr;gap:50px;color:#fff;}
  .ablauf .secstar{font-family:'Audiowide',sans-serif;font-size:13px;letter-spacing:.28em;color:var(--orange);margin-bottom:14px;}
  .ablauf h3{font-family:'Bebas Neue',sans-serif;font-size:54px;color:#fff;letter-spacing:1px;margin-bottom:26px;}
  .steplist{display:flex;flex-direction:column;gap:14px;}
  .step{display:flex;align-items:center;gap:18px;}
  .step .n{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--hpink);width:42px;height:42px;border:1.5px solid var(--hpink);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
  .step .t{font-size:17px;font-weight:500;color:#e9e3f5;}
  .stagebox{background:linear-gradient(160deg,#1a0838,#0a0418);border:1px solid rgba(246,113,166,.25);border-radius:18px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .stagebox .sgrid{position:absolute;left:-20%;right:-20%;bottom:0;height:180px;background-image:linear-gradient(to right,rgba(246,113,166,.4) 1px,transparent 1px),linear-gradient(to bottom,rgba(231,24,117,.4) 1px,transparent 1px);background-size:40px 34px;transform:perspective(200px) rotateX(70deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent);}

  .about{background:#120a22;padding:64px 50px;color:#fff;}
  .about .secstar{font-family:'Audiowide',sans-serif;font-size:13px;letter-spacing:.28em;color:var(--orange);margin-bottom:12px;}
  .about h3{font-family:'Bebas Neue',sans-serif;font-size:50px;letter-spacing:1px;margin-bottom:34px;}
  .about .grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;}
  .carcanvas{background:radial-gradient(ellipse at 50% 70%, #2d0a5e, #0a0418);border:1px solid rgba(246,113,166,.22);border-radius:18px;height:300px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .about p{font-size:16px;line-height:1.7;color:#cfc7dd;margin-bottom:18px;}
  .about .stats{display:flex;gap:30px;margin-top:10px;}
  .about .stats .st .num{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--lpink);line-height:1;}
  .about .stats .st .lab{font-size:12px;color:#9a93ab;letter-spacing:.05em;margin-top:4px;}

  .services{background:#0d0620;padding:64px 50px;}
  .services h3{font-family:'Bebas Neue',sans-serif;font-size:50px;color:#fff;text-align:center;letter-spacing:1px;margin-bottom:40px;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
  .card{background:linear-gradient(165deg,#1f0d44,#140827);border:1px solid rgba(246,113,166,.2);border-radius:18px;padding:34px 28px;text-align:center;}
  .card .ic{width:64px;height:64px;margin:0 auto 20px;border-radius:16px;background:linear-gradient(135deg,var(--hpink),var(--orange));display:flex;align-items:center;justify-content:center;}
  .card h4{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:1px;margin-bottom:12px;}
  .card p{font-size:14px;color:#b6aeca;line-height:1.6;}

  .faq{background:#120a22;padding:64px 50px;}
  .faq h3{font-family:'Bebas Neue',sans-serif;font-size:50px;color:#fff;text-align:center;letter-spacing:1px;margin-bottom:36px;}
  .faqitem{background:#1a0838;border:1px solid rgba(246,113,166,.18);border-radius:12px;padding:20px 26px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .faqitem .q{font-size:17px;font-weight:600;color:#fff;}
  .faqitem .pl{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--hpink);}
  .faqitem.open .a{display:block;}
  .faqitem .a{display:none;}

  .ctablock{background:radial-gradient(ellipse at 50% 0%, #4a0e7a, #0a0418 70%);padding:80px 50px;text-align:center;}
  .ctablock h3{font-family:'Bebas Neue',sans-serif;font-size:64px;color:#fff;letter-spacing:1px;text-shadow:0 0 30px rgba(246,113,166,.4);margin-bottom:14px;}
  .ctablock p{color:#cfc7dd;font-size:17px;margin-bottom:34px;}
  .ctabtns{display:flex;gap:18px;justify-content:center;}
  .ctabtns .b{padding:15px 36px;border-radius:34px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:#fff;}
  .ctabtns .b1{background:linear-gradient(90deg,var(--hpink),var(--lpink));}
  .ctabtns .b2{background:linear-gradient(90deg,#25D366,#128C7E);}
  .ctabtns .b3{background:linear-gradient(90deg,var(--orange),var(--red));}

  .foot{background:#08030f;padding:54px 50px 34px;color:#fff;}
  .foot .top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;}
  .foot .logo{font-family:'Caveat',cursive;font-weight:700;font-size:30px;color:var(--lpink);margin-bottom:14px;}
  .foot p{font-size:14px;color:#8e87a3;line-height:1.7;}
  .foot .col h5{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:#fff;margin-bottom:16px;}
  .foot .col a{display:block;font-size:14px;color:#9a93ab;text-decoration:none;margin-bottom:10px;}
  .foot .copy{border-top:1px solid rgba(255,255,255,.08);margin-top:36px;padding-top:22px;text-align:center;font-size:13px;color:#6e667f;}
